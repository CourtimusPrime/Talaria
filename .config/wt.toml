# Worktrunk project config — parallel worktree execution for Talaria.
#
# Why this exists: Talaria links Servo. A bare `git worktree add` gives you a
# checkout with no `target/`, so an executor working there cold-builds the whole
# engine — tens of minutes and ~27 GB, per worktree. That cost is why GSD phase
# execution runs sequentially on the primary checkout by default.
#
# These hooks make a worktree cheap enough to be worth creating:
#
#   1. Each worktree gets its OWN persistent target dir outside the worktree,
#      keyed by branch. Deliberately not one shared dir: two worktrees at
#      different source states would alternately invalidate each other and
#      relink the ~180 MB shell binary back and forth, and concurrent
#      `cargo build` takes an exclusive lock on the target dir anyway.
#   2. sccache fronts rustc, so those separate target dirs share compilation
#      results instead of each one building Servo from scratch.
#   3. Each worktree gets a distinct X display and XDG_RUNTIME_DIR, so two
#      concurrent e2e runs don't collide. The suite defaults to display :99 and
#      resolves the control socket under XDG_RUNTIME_DIR; without this, two
#      shells fight over one socket path.
#
# The primary checkout has no generated .cargo/config.toml, so it keeps using
# ./target exactly as before. Nothing here changes single-worktree workflow.
#
# See .config/README.md for how a GSD orchestrator drives this.

[[pre-start]]
# Blocking: the build config must exist before anything compiles.
cargo-config = """
set -eu
TARGET_DIR="$HOME/.cache/talaria-target/{{ branch | sanitize_hash }}"
mkdir -p .cargo "$TARGET_DIR"
{
  printf '# Generated by wt pre-start. Not tracked; see .config/wt.toml.\\n'
  printf '[build]\\n'
  printf 'target-dir = "%s"\\n' "$TARGET_DIR"
  if command -v sccache >/dev/null 2>&1; then
    printf 'rustc-wrapper = "%s"\\n' "$(command -v sccache)"
  fi
} > .cargo/config.toml
"""

[[pre-start]]
# Blocking: written before the executor is dispatched, which sources it.
# hash_port yields 10000-19999, a valid and collision-resistant X display number.
wt-env = """
set -eu
RUNTIME_DIR="/tmp/talaria-wt-{{ branch | sanitize_hash }}"
mkdir -p "$RUNTIME_DIR"
chmod 700 "$RUNTIME_DIR"
{
  printf '# Generated by wt pre-start. Source before building or running e2e.\\n'
  printf 'export CARGO_TARGET_DIR=%s\\n' "$HOME/.cache/talaria-target/{{ branch | sanitize_hash }}"
  printf 'export TALARIA_E2E_DISPLAY=:{{ branch | hash_port }}\\n'
  printf 'export XDG_RUNTIME_DIR=%s\\n' "$RUNTIME_DIR"
} > .wt-env
"""

[[post-start]]
# Background: warm the target dir so the executor doesn't wait on a cold build.
# Failure here is not fatal — the executor will just build on demand.
warm-build = "sh -c '. ./.wt-env && cargo build --release' || true"

[[pre-remove]]
# The e2e suite leaves an Xvfb behind if a run is killed mid-flight. The display
# number is derived from the branch, so this only ever targets this worktree's.
# Block form, not `[pre-remove]` — table form for pre-* hooks is deprecated.
stop-xvfb = "pkill -f 'Xvfb :{{ branch | hash_port }}' || true"
