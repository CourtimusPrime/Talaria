[workspace]
resolver = "2"
members = [
    "crates/talaria-shell",
    "crates/talaria-protocol",
    "crates/talaria-mcp",
    "crates/talaria-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/court/talaria"

# ---------------------------------------------------------------------------
# Cargo.lock is load-bearing. Do not regenerate it casually.
#
# `primeorder` is held at 0.14.0-rc.14 (Cargo.lock, the `primeorder` package
# entry). Nothing in this table pins it — it is a transitive dependency pulled
# in through servo, and the constraint exists only inside the committed
# lockfile. A fresh resolution takes primeorder 0.14.0 final, which no longer
# satisfies the trait bounds that p256, p384 and p521 0.14.0-rc.14 are written
# against, and the build fails with a trait-bound error that names none of this.
#
# Recovery, if it has already drifted:
#
#     cargo update -p primeorder --precise 0.14.0-rc.14
#
# CI builds `--locked` so an ordinary push never re-resolves. The drift is
# watched deliberately instead: .github/workflows/lockfile-audit.yml resolves
# from scratch on a weekly schedule and prints the diagnosis above when the
# build fails. That job never writes a lockfile back.
# ---------------------------------------------------------------------------

[workspace.dependencies]
# Servo engine (libservo, published on crates.io as `servo`).
# Versions below track servo v0.4.0's own workspace pins.
servo = "0.4.0"
embedder_traits = { package = "servo-embedder-traits", version = "=0.4.0" }
winit = "0.30.13"
euclid = "0.22"
url = "2.5"
webrender_api = "0.69"
rustls = "0.23"
tracing = "0.1"
# Chrome UI — versions must match servo's own workspace (shared glow context type).
egui = "0.34.3"
egui-winit = "0.34.3"
egui_glow = { version = "0.34.3", features = ["winit"] }
egui-phosphor = "0.12"
glow = "0.17"
# Shell plumbing
talaria-protocol = { path = "crates/talaria-protocol" }
# The intra-workspace edge 04-01's `[lib]` target exists for: the shell links
# the MCP tool surface rather than defining a second copy of it.
talaria-mcp = { path = "crates/talaria-mcp" }
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
dirs = "5"
ureq = "2"
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
rand = "0.8"
hex = "0.4"
# The `sse` feature is deliberately absent from *this line* — and is enabled anyway,
# transitively, by `rust-mcp-axum` below: `cargo tree -p talaria-shell -e features -i
# rust-mcp-sdk` shows `rust-mcp-sdk feature "http"` pulling in `feature "sse"`, and it
# has to, because `rust_mcp_axum::routes::sse_routes` calls the `#[cfg(feature = "sse")]`
# handler unconditionally. Not listing it here therefore buys nothing: `/sse` and
# `/messages` are mounted and live. The 2026-07-28 MCP revision deprecates that legacy
# HTTP+event-stream transport, and a long-lived legacy stream is the most likely way a
# revoked client keeps talking after its token is gone (04-RESEARCH.md Pitfall 4), so
# `crates/talaria-shell/src/http.rs` closes those streams on a revoke explicitly rather
# than relying on this line. Do not read this as "the routes are inert".
rust-mcp-sdk = { version = "1.0.1", default-features = false,
                 features = ["server", "macros", "stdio", "streamable-http", "auth"] }
# The SDK's own supported Axum backend — `create_axum_server`, `AxumServerOptions`,
# DNS-rebinding protection, `mcp_routes()`.
#
# Package Legitimacy Audit (04-RESEARCH.md, crates.io API 2026-08-20): first
# published 2026-06-24 with ~600 downloads, flagged SUS on age and volume, and
# cleared on provenance — same GitHub repository (rust-mcp-stack/rust-mcp-sdk) and
# same crates.io owner as the rust-mcp-sdk above, named in that SDK's own README as
# its supported Axum backend.
rust-mcp-axum = "1.0.1"
# The WebSocket route this phase's frame channel is built on
# (`axum::extract::ws`), per 05-CONTEXT.md D-05-05.
#
# This line unifies rather than resolves. `axum 0.8.9` is already in this tree
# through the `rust-mcp-axum` above, and `crates/talaria-shell/src/http.rs`
# already uses it by name as `rust_mcp_axum::axum::*`. Declaring it directly
# holds the member on that same crate node and lets `http.rs` write
# `axum::extract::ws::WebSocketUpgrade` without going through the re-export.
#
# The `ws` feature's entire measured cost is **one** added package,
# `tokio-tungstenite 0.29.0`. Its two other feature edges — `sha1 0.10` and
# `base64 0.22.1` — are already resolved here, and its sibling
# `tungstenite 0.29.0` is already in the lock through `servo-net` ->
# `async-tungstenite`, so Servo's own network stack already links this
# codebase. That is the legitimacy answer (05-RESEARCH.md, Package Legitimacy
# Audit: no [SUS], no [SLOP]) and it is a stronger one than a download count.
#
# D-05-05 chose this over adding a codec crate: frame encoding reuses the `png`
# line above at `Compression::Fast` over 64x64 tile diffs, so the WebSocket is
# the only dependency the whole frame pipeline costs.
axum = { version = "0.8.9", features = ["ws"] }
async-trait = "0.1"
# Token hashing and PKCE S256. Already resolved at 0.11.0 through the servo tree.
sha2 = "0.11"

# --- `talaria-client` only, below. The three lines the second front end costs. ---
#
# The low-level GL context the client's window draws through, so that binary
# needs no engine to have a surface. `WindowRenderingContext` — the type
# `crates/talaria-shell/src/gui.rs` builds egui on — is servo-paint-api's
# wrapper around exactly this crate, at exactly this version, with exactly
# these features (`servo-paint-api-0.4.0/Cargo.toml`, its `[dependencies.surfman]`
# block). So this line unifies onto a node the engine already put in the lock
# rather than resolving a new one, and its measured cost is **zero added
# packages**. That is also the provenance answer: the graphics stack the client
# links is the graphics stack the engine in this same workspace already links.
#
# `sm-x11` matches servo-paint-api's own spelling; `sm-raw-window-handle-06` is
# surfman's default and is what lets `Connection::from_display_handle` take the
# handle `winit` 0.30 hands out, since both sides are `raw-window-handle` 0.6.2.
surfman = { version = "0.13.0", features = ["sm-x11"] }
# The client's `wss://` connection to a server's `/view`.
#
# `tokio-tungstenite 0.29.0` is already in this lock — the `axum` line above
# put it there with its `ws` feature — so this line adds no package either. The
# TLS feature was measured in 05-01 against a throwaway manifest by the same
# hand-edit-and-resolve procedure: `rustls-tls-native-roots` costs **zero**
# packages, because `rustls 0.23.43`, `tokio-rustls 0.26.4`,
# `rustls-pki-types 1.15.1` and `rustls-native-certs 0.8.4` are all already
# resolved here. The `native-tls` spelling costs 7 packages plus a C dependency
# on OpenSSL and is deliberately not taken.
#
# **Native roots rather than webpki roots**, also per 05-01: the server is
# fronted by a daemon-managed certificate for a real name, chaining to a public
# root the platform trust store already carries, and using the platform store is
# the behaviour a human expects from a client running on their own machine.
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
# The `Stream` and `Sink` extension traits `tokio-tungstenite`'s socket type is
# written against — reading a message is `StreamExt::next`, and the trait has to
# be nameable to be called. Not a third dependency in the sense 05-01 measured:
# `tokio-tungstenite` already depends on it, so it was in this lock before this
# line existed and adds nothing. Taken with `default-features = false` so the
# client links the two pieces it uses rather than the whole toolkit.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# The logging facade, declared here rather than as the version string
# `crates/talaria-shell/Cargo.toml` carries at its last line. That line is a
# wart, not a pattern; this is where a workspace dependency belongs.
log = "0.4"
# The client's logger. The shell installs none because `servo.setup_logging()`
# does it (and panics if one is already set); the client has no engine to defer
# to, so a client without this line would emit through `log::` macros that go
# nowhere and a connection failure would be invisible outside the window.
# Already resolved in this tree, so it is another zero-package line.
env_logger = "0.11"

[profile.release]
lto = "thin"

# Servo's own recommendation: optimize deps even in dev builds,
# otherwise debug-build page rendering is unusably slow.
[profile.dev.package."*"]
opt-level = 2
