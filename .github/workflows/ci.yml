name: CI

# Deliberately no branch filter and no path filter.
#
# A `paths:` / `paths-ignore:` filter is what lets a push produce zero jobs and
# still show a green tick: GitHub reports "no runs required" as success, so a
# commit that touched nothing the filter matched would look verified when
# nothing verified it. Every push and every pull request runs this gate,
# including a push that changes no Rust source at all. If this file ever grows a
# path filter, that guarantee is gone.
on:
  push:
  pull_request:

# The job reads the checkout and writes nothing back. A pull request from a fork
# therefore cannot obtain a write-scoped token through this workflow.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run of that ref obsolete. The
# self-hosted runner is a single machine, so leaving superseded runs queued would
# make every later push wait behind work whose result nobody will read. `main` is
# excluded: its runs are the record that a merged commit was verified, and that
# record should not be cancellable by the next merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The fast gate. Build, clippy, unit tests — no end-to-end suite. It runs on
  # the self-hosted runner because that machine already holds the warm Servo
  # build directory: the same verification is ~3 minutes there and ~3 hours on a
  # hosted runner, which cannot cache a 42 GB target/ into a 10 GB cache and so
  # rebuilds Servo from scratch every single time.
  #
  # The from-scratch build is still verified, just not on every push — see
  # cold-build.yml, which runs it weekly on ubuntu-latest.
  fast-gate:
    name: build, clippy, unit tests
    runs-on: [self-hosted, linux, thinkpad]

    # PUBLIC REPOSITORY + SELF-HOSTED RUNNER. Read before editing.
    #
    # A self-hosted runner executing a fork's pull request runs a stranger's code
    # on a personal machine, with that machine's filesystem, network and tailnet
    # reachable from inside the job. GitHub's own documentation calls this out as
    # unsafe for public repositories.
    #
    # Two controls stand between a fork PR and this runner, deliberately not one:
    #
    #   1. Repository setting — Actions is configured to require approval from
    #      ALL external contributors, so a fork PR does not start a run at all
    #      until a maintainer approves it.
    #   2. This condition — even if that setting is changed, weakened, or reset
    #      by a future admin action, a pull request whose head repository is not
    #      this repository does not reach the self-hosted runner.
    #
    # Control 1 lives in repository settings, outside version control, and can be
    # changed silently by anyone with admin rights. Control 2 lives here and
    # cannot be changed without a commit somebody can review. That asymmetry is
    # the whole reason both exist. Do not delete this condition on the grounds
    # that the setting already covers it.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # No apt install step and no cache step. Both exist only to reconstruct, on
      # a fresh hosted machine, the state this runner already holds permanently.
      # Reinstalling Servo's build prerequisites on every run of a persistent
      # machine buys nothing; cold-build.yml is where a missing prerequisite gets
      # caught, because that job starts from an image that has none of them.

      # No rust-toolchain.toml is committed, so the toolchain is whatever the
      # runner has. Print it rather than assume it: a failure caused by a
      # toolchain bump should be readable in the log instead of inferred.
      - name: Record toolchain versions
        run: |
          set -euo pipefail
          rustc --version
          cargo --version

      # --locked so CI uses the committed lockfile. That lockfile is load-bearing:
      # it holds primeorder back to a release candidate (see the comment in
      # Cargo.toml). Resolving fresh is the scheduled lockfile-audit job's
      # business, never this one's.
      - name: Build the workspace in release mode
        run: cargo build --release --locked

      # Both binaries must exist before anything claims the build succeeded.
      # e2e.yml's harness launches the talaria binary and mcp_client_test drives
      # talaria-mcp; asserting it here stops a later reorganisation from
      # producing a green build whose e2e run then fails for an unrelated-looking
      # reason.
      #
      # Resolved through CARGO_TARGET_DIR rather than hardcoded to ./target. This
      # runner sets that variable so its throwaway checkout shares one warm
      # dependency build, which means ./target does not exist in the workspace at
      # all. tests/e2e/harness.py resolves the same way.
      - name: Assert both release binaries exist
        run: |
          set -euo pipefail
          target="${CARGO_TARGET_DIR:-target}"
          test -x "$target/release/talaria"
          test -x "$target/release/talaria-mcp"
          echo "both release binaries present in $target/release"

      - name: Clippy with warnings denied
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust unit tests
        run: cargo test --locked
