[package]
name = "talaria-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Talaria remote view client — a second front end for a Talaria server's agent tabs, with no web engine"

[[bin]]
name = "talaria-client"
path = "src/main.rs"

# Every line below is `{ workspace = true }`, with no version string anywhere in
# this file. The shell's manifest ends with one `log = "0.4"`; that is a wart
# this manifest deliberately does not copy.
#
# **The web engine is absent, and its absence is the point of this crate.** A
# client that linked the engine would take the engine's native build
# prerequisites with it, and the whole user-facing benefit here is a binary that
# builds in seconds and runs on a laptop carrying none of them.
# `cargo tree -p talaria-client` is the assertion; this comment is the reason.
[dependencies]
winit = { workspace = true }
euclid = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }
surfman = { workspace = true }

egui = { workspace = true }
egui-winit = { workspace = true }
egui_glow = { workspace = true }
egui-phosphor = { workspace = true }
glow = { workspace = true }

# The frame channel's payload codec, and the *only* dependency this plan adds.
#
# **Zero added packages, and no resolution.** `png 0.17` is already declared in
# `[workspace.dependencies]` and already in `Cargo.lock` at 0.17.16 — the
# server's frame encoder is the other end of this exact line — so this is an
# edge onto a node the lock already carries rather than a package fetched from a
# registry. `cargo build --locked` is what proves it: a resolution would fail
# against the committed lock rather than quietly rewriting it. The lock's own
# diff is one line, `"png 0.17.16"` in this crate's dependency list.
png = { workspace = true }

talaria-protocol = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
